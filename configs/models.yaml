# EcoRoute model catalog (starting pool). See docs/model-research.md.
#
# price_*_per_mtok : USD per 1M tokens, standard tier, as of 2026-10-01.
#                    Anthropic prices are official; others come from aggregators. Check before production.
# energy           : Wh per 1K output tokens.
#                    source "measured": we measure it on the GPU (NVML).
#                    source "prior": order-of-magnitude estimate by tier; providers do not publish
#                    per-model numbers. Replace with measurements whenever possible.
# clearance        : highest confidentiality level this model may receive
#                    (public < internal < confidential < restricted).
#                    External APIs default to "internal"; raise to "confidential" only with a
#                    zero-data-retention / DPA contract in place.
# api_id           : null means the exact provider model ID still has to be confirmed.
# label_source     : how the router learns this model's ability (see docs/zero-cost-plan.md):
#                    free_eval (we grade it on free compute / free API tier),
#                    benchmark_prior (placed from published benchmark scores, no API calls).
# anchor           : how the trained predictor scores this model (see predictors/catalog.py):
#                    logit P = logit P(anchor model) + shift. Anchors are SPROUT models of a
#                    similar tier, ordered by their SPROUT accuracy. source "prior" shifts only
#                    encode tier order (0, or +0.25 to separate the top tier from its anchor);
#                    replace them with fitted shifts from a few hundred graded answers.
# enabled          : false keeps an entry for reference without routing to it.

levels: [public, internal, confidential, restricted]

models:
  - name: llama-3.1-8b-local
    tier: 0
    provider: local-ollama
    api_id: llama3.1:8b-instruct-q4_K_M
    context: 131072
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0
    energy: {wh_per_1k_out: null, source: measured}
    clearance: restricted
    label_source: free_eval
    # The same model SPROUT grades, so its predictions need no shift. 4-bit may cost a little
    # accuracy against the full-precision scores; a fitted shift will measure it.
    anchor: {model: llama-3.1-8b-instruct, shift: 0.0, source: prior}
    # Self-hosted, so it is costed from its hardware (see Router.true_cost): electricity
    # while generating plus the GPU's hourly cost. 215 W is the RTX 2070 Super board power;
    # tokens_per_second is an estimate for an 8B 4-bit model, replace with a measurement.
    # gpu_usd_per_hour: what an hour of this GPU costs you (rental, or purchase spread over
    # its life); 0 counts only the electricity.
    hosting: {gpu_watts: 215, tokens_per_second: 50, gpu_usd_per_hour: 0.0}
    notes: "Runs on an 8 GB GPU through Ollama (about 5 GB at 4-bit)."

