<title id="t">How EcoRoute routed one request</title>
<desc id="d">Prompt: Prove that there are infinitely many primes of the form 4k+3. Profile balanced, level internal. Chosen model gemini-3.8-flash. Chose gemini-3.8-flash: cheapest qualifying model (P=0.91, $0.00189, 0.075 Wh (estimated)). 81% cheaper than the priciest allowed model, claude-opus-5-5.</desc>
