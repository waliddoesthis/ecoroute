[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoroute"
version = "0.1.0"
description = "Explainable, eco-aware LLM router"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Walid"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "datasets>=2.18",
    "huggingface_hub>=0.22",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
